name: CI

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install linters
        run: pip install ruff mypy
      - name: Ruff check
        run: ruff check src/ tests/ main.py
      - name: Ruff format check
        run: ruff format --check src/ tests/ main.py

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install mypy
          pip install pydantic numpy pandas scikit-learn fastapi
      - name: Mypy
        run: mypy src/ --ignore-missing-imports --no-strict-optional

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install \
            "category-encoders>=2.6.0,<2.7.0" \
            "imbalanced-learn>=0.11.0,<0.13.0" \
            "matplotlib>=3.7.0,<3.10.0" \
            "numpy>=1.24.0,<1.27.0" \
            "pandas>=2.0.0,<2.1.0" \
            "pydantic>=2.0.0,<3.0.0" \
            "scikit-learn>=1.3.0,<1.6.0" \
            "scipy>=1.11.0,<1.14.0" \
            "seaborn>=0.12.0,<0.14.0" \
            "torch>=2.0.0,<2.3.0" \
            "tqdm>=4.65.0" \
            "fastapi>=0.109.1" \
            "uvicorn[standard]>=0.27.0" \
            "httpx>=0.25.0" \
            "pytest>=7.4.0"
      - name: Run tests
        run: pytest tests/ -v --tb=short

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t driver-behavior-detection .
