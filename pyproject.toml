[project]
name = "abax"
version = "0.1.0"
description = "ABAX Data Science Technical Assessment"
requires-python = ">=3.9"
dependencies = [
    "alembic>=1.13.0,<2.0.0",
    "category-encoders>=2.6.0,<2.7.0",
    "imbalanced-learn>=0.11.0,<0.13.0",
    "ipykernel>=6.25.0",
    "jupyter>=1.0.0",
    "jupytext>=1.15.0",
    "matplotlib>=3.7.0,<3.10.0",
    "numpy>=1.24.0,<1.27.0",
    "pandas>=2.0.0,<2.1.0",
    "pyarrow>=15.0.0",
    "plotly>=5.18.0",
    "pydantic>=2.0.0,<3.0.0",
    "pydantic-settings>=2.2.0,<3.0.0",
    "sqlalchemy>=2.0.0,<3.0.0",
    "psycopg[binary]>=3.1.0,<4.0.0",
    "celery>=5.4.0,<5.5.0",
    "redis>=5.0.0,<6.0.0",
    "pytest>=7.4.0",
    "requests>=2.31.0",
    "scikit-learn>=1.3.0,<1.6.0",
    "scipy>=1.11.0,<1.14.0",
    "seaborn>=0.12.0,<0.14.0",
    "tqdm>=4.65.0",
    "ruff>=0.4.0",
    "pre-commit>=3.7.0",
    "mypy>=1.8.0",
    "fastapi>=0.109.1",
    "uvicorn[standard]>=0.27.0",
]

[project.optional-dependencies]
deep-learning = [
    "torch>=2.0.0,<2.3.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [
    "data/UAH-DRIVESET-v1/uah_driveset_reader",
    "notebooks",
    "scripts",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
combine-as-imports = true

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_configs = true
no_strict_optional = true
disallow_untyped_defs = false
check_untyped_defs = false

[[tool.mypy.overrides]]
module = [
    "src.models.simple_nn",
    "src.models.cnn",
    "src.models.resnet",
    "src.models.robust_sparse",
]
ignore_errors = true
