services:
  abax-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: abax-analytics
    ports:
      - "8000:8000"
    environment:
      ABAX_APP_VERSION: "2.0.0"
      ABAX_TEST_SIZE: "0.2"
      ABAX_RANDOM_STATE: "42"
      ABAX_CLASSIFICATION_CACHE_CSV: "/tmp/uah_raw_features.parquet"
    volumes:
      - ./data:/app/data:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 35s
